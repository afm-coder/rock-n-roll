name: Update Club Member Count

on:

  schedule:

    - cron: "0 * * * *"

  workflow_dispatch:


permissions:

  contents: write


jobs:

  update-members:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Node.js
        uses: actions/setup-node@v4

        with:

          node-version: 24


      - name: Update member count
        run: node update-members.js


      - name: Commit updated member count
        run: |

          git config user.name "github-actions[bot]"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add members.json

          git diff --cached --quiet || git commit -m "Update club member count"

          git push
